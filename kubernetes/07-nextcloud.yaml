# --- ConfigMap for Nextcloud ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-cm
  namespace: multi-agent-ecosystem
data:
  POSTGRES_DB: "nextcloud"
  POSTGRES_USER: "nextcloud"
  REDIS_HOST: "nextcloud-redis"

---
# --- Persistent Volumes for Nextcloud and its Database ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-pvc
  namespace: multi-agent-ecosystem
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi # Adjust as needed for file storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-db-pvc
  namespace: multi-agent-ecosystem
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # Adjust as needed for database size

---
# --- PostgreSQL Database for Nextcloud ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-db
  namespace: multi-agent-ecosystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-db
  template:
    metadata:
      labels:
        app: nextcloud-db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        envFrom:
        - configMapRef:
            name: nextcloud-cm
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: nextcloud-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-db
  namespace: multi-agent-ecosystem
spec:
  selector:
    app: nextcloud-db
  ports:
  - port: 5432

---
# --- Redis Cache for Nextcloud ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: multi-agent-ecosystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-redis
  template:
    metadata:
      labels:
        app: nextcloud-redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: multi-agent-ecosystem
spec:
  selector:
    app: nextcloud-redis
  ports:
  - port: 6379

---
# --- Nextcloud Application ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: multi-agent-ecosystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
      - name: nextcloud
        image: nextcloud:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: nextcloud-cm
        env:
        - name: POSTGRES_HOST
          value: "nextcloud-db"
        - name: NEXTCLOUD_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: nextcloud-secrets
              key: NEXTCLOUD_ADMIN_USER
        - name: NEXTCLOUD_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-secrets
              key: NEXTCLOUD_ADMIN_PASSWORD
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: nextcloud-storage
          mountPath: /var/www/html
      volumes:
      - name: nextcloud-storage
        persistentVolumeClaim:
          claimName: nextcloud-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: multi-agent-ecosystem
spec:
  selector:
    app: nextcloud
  ports:
  - name: http
    port: 8080
    targetPort: 80
  type: LoadBalancer