apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secrets
  namespace: multi-agent-ecosystem
type: Opaque
data:
  # These values must be base64 encoded.
  # For example, to encode 'your_strong_postgres_password':
  # echo -n 'your_strong_postgres_password' | base64
  # The user will need to replace these placeholders with their own encoded secrets.
  POSTGRES_PASSWORD: eW91cl9zdHJvbmdfcG9zdGdyZXNfcGFzc3dvcmQ= # placeholder: your_strong_postgres_password
  NEXTCLOUD_ADMIN_USER: YWRtaW4= # placeholder: admin
  NEXTCLOUD_ADMIN_PASSWORD: eW91cl9zdHJvbmdfYWRtaW5fcGFzc3dvcmQ= # placeholder: your_strong_admin_password